# Localhost se declara primero para que phpMyAdmin y htdocs no queden
# capturados por TechStore.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Tras npm run build, Apache sirve la SPA y la API Laravel en el mismo dominio.
# Laravel 13 requiere PHP 8.3+. XAMPP trae 8.2, por eso este host usa C:\PHP.
<VirtualHost *:80>
    ServerName techstore.local
    ServerAlias www.techstore.local
    DocumentRoot "E:/8vo/analisis/proyecto/backend/public"

    <Directory "E:/8vo/analisis/proyecto/backend/public">
        Options FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted
        AcceptPathInfo On
    </Directory>

    SetEnv PHPRC "C:/PHP"
    ScriptAlias /php85-cgi/ "C:/PHP/"
    <Directory "C:/PHP">
        AllowOverride None
        Options None
        Require all denied
        <Files "php-cgi.exe">
            Require all granted
        </Files>
    </Directory>

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php-cgi
    </FilesMatch>
    Action application/x-httpd-php-cgi "/php85-cgi/php-cgi.exe"

    ErrorLog "logs/techstore-error.log"
    CustomLog "logs/techstore-access.log" common
</VirtualHost>
